<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snagger — Snagger</title>

  <!--
    This page has MOVED to snagger-app.com and is now a redirect.

    It used to hold its own copy of the text, which is how it came to be wrong:
    the privacy policy here still described Google Drive as the only place data
    went, with no mention of Supabase, accounts or cloud sync — untrue since V2
    and more untrue since sync became free for everyone. A published privacy
    policy that misdescribes where a user's data goes is not a stale page, it is
    a false statement, and it stayed live because nobody remembered this copy
    existed.

    The fix is a redirect rather than a re-write, deliberately. Two copies of
    legal text maintained by hand will diverge again; there is now exactly one
    of each, on snagger-app.com, and this URL points at it so anything already
    linking here still arrives somewhere correct.
  -->
  <link rel="canonical" href="https://snagger-app.com/" />
  <meta http-equiv="refresh" content="0; url=https://snagger-app.com/" />
  <meta name="robots" content="noindex, follow" />
  <script>window.location.replace("https://snagger-app.com/");</script>

  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1a1f2a; background: #fff; padding: 24px; text-align: center;
    }
    a { color: #1B5EBF; }
  </style>
</head>
<body>
  <!-- Shown only if the redirect does not fire (no JS and no meta refresh). -->
  <p>
    This page has moved to <a href="https://snagger-app.com/">https://snagger-app.com/</a>.
  </p>
</body>
</html>
